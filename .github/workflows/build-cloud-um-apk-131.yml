name: build-cloud-um-apk-131
on:
  push:
    branches:
      - tmp-cloud-android-build-131-20260921

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Rebuild, verify and patch source package
        run: |
          cat android131-small/part00 android131-small/part01 android131-small/part02 android131-small/part03 android131-small/part04 android131-small/part05a android131-small/part05b1 android131-small/part05b2a android131-small/part05b2b android131-small/part05b2c android131-small/part06 > android-build-src.b64
          base64 --decode android-build-src.b64 > android-build-src.zip
          echo "734b6fba5486c72b0e0f8bb3fbd7b0c6cf4449cf5c023da2ac290ec49aab95c2  android-build-src.zip" | sha256sum -c -
          unzip -t android-build-src.zip
          mkdir android-build
          unzip -q android-build-src.zip -d android-build
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android-build/app/src/main/java/pl/przemysl/cloud/mobile/MainActivity.java")
          s=p.read_text()
          s=s.replace('replaceAll("\\p{M}+", "")', 'replaceAll("\\\\p{M}+", "")')
          s=s.replace('replaceAll("\\s+", " ")', 'replaceAll("\\\\s+", " ")')
          p.write_text(s)
          PY
          echo "1e55164e5b387d6d3bd7735d5396d2d26e5adc75001a10bb224064a63d3f00a9  android-build/app/src/main/java/pl/przemysl/cloud/mobile/MainActivity.java" | sha256sum -c -

      - name: Install Android SDK
        working-directory: android-build
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build unsigned release
        working-directory: android-build
        run: gradle :app:assembleRelease --stacktrace

      - name: Align APK and collect signing tool
        working-directory: android-build
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk CloudUM-1.3.1-unsigned-aligned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" apksigner.jar

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: cloud-um-android-build-131
          path: |
            android-build/CloudUM-1.3.1-unsigned-aligned.apk
            android-build/apksigner.jar
          retention-days: 1
