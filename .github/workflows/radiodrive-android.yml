name: RadioDrive APK build

on:
  workflow_dispatch:
  push:
    branches: [ radiodrive-apk-build ]
    paths:
      - 'radiodrive/**'
      - '.github/workflows/radiodrive-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager --licenses >/dev/null || true; sdkmanager "platforms;android-37" "build-tools;37.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build debug APK
        working-directory: radiodrive
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RadioDrive-debug
          path: radiodrive/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
