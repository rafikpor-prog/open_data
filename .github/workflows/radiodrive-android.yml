name: RadioDrive APK build

on:
  workflow_dispatch:
  push:
    branches: [ radiodrive-apk-build ]
    paths:
      - 'radiodrive/**'
      - '.github/workflows/radiodrive-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build unsigned release APK
        working-directory: radiodrive
        run: gradle :app:assembleRelease --stacktrace
      - name: Align APK and collect signer
        shell: bash
        run: |
          "$ANDROID_SDK_ROOT/build-tools/37.0.0/zipalign" -f -P 16 4             radiodrive/app/build/outputs/apk/release/app-release-unsigned.apk             RadioDrive-2.6.0-unsigned-aligned.apk
          cp "$ANDROID_SDK_ROOT/build-tools/37.0.0/lib/apksigner.jar" apksigner.jar
      - name: Upload unsigned release
        uses: actions/upload-artifact@v4
        with:
          name: RadioDrive-2.6-release-unsigned
          path: |
            RadioDrive-2.6.0-unsigned-aligned.apk
            apksigner.jar
          if-no-files-found: error
