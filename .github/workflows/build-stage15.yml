      - name: Integrate module and update versions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('work/build/przemysl-tour-races')
          main = root / 'przemysl-tour-races.php'
          text = main.read_text(encoding='utf-8')
          text, header_count = re.subn(r'(\*\s*Version:\s*)[0-9]+(?:\.[0-9]+)+', r'\g<1>1.5.0', text, count=1)
          if header_count != 1:
              raise SystemExit('Nie znaleziono naglowka Version w pliku glownym')
          text, version_count = re.subn(
              r"(define\s*\(\s*['\"]PTR_VERSION['\"]\s*,\s*['\"])[^'\"]+(['\"]\s*\)\s*;)",
              r'\g<1>1.5.0\g<2>',
              text,
              count=1,
          )
          if version_count != 1:
              raise SystemExit('Nie znaleziono stalej PTR_VERSION')
          text, db_count = re.subn(
              r"(define\s*\(\s*['\"]PTR_DB_VERSION['\"]\s*,\s*['\"])[^'\"]+(['\"]\s*\)\s*;)",
              r'\g<1>2.3.0\g<2>',
              text,
              count=1,
          )
          if db_count != 1:
              raise SystemExit('Nie znaleziono stalej PTR_DB_VERSION')
          include_line = "\n// Etap 15: finalny audyt i gotowosc produkcyjna.\nrequire_once __DIR__ . '/includes/class-ptr-production-readiness.php';\n"
          if 'class-ptr-production-readiness.php' not in text:
              text = text.rstrip() + include_line
          main.write_text(text, encoding='utf-8')

          for readme_name in ('readme.txt', 'README.md'):
              path = root / readme_name
              if path.exists():
                  content = path.read_text(encoding='utf-8')
                  content = re.sub(r'(Stable tag:\s*)[0-9]+(?:\.[0-9]+)+', r'\g<1>1.5.0', content, count=1, flags=re.I)
                  if 'Etap 15' not in content:
                      content += '\n\n## Etap 15 / wersja 1.5.0\n- Końcowy audyt gotowości produkcyjnej.\n- Lista wdrożeniowa i eksport bezpiecznej diagnostyki.\n- Integracja ze Stanem witryny i panelem WordPress.\n- Dokumentacja administratora, wdrożenia i testów regresji.\n'
                  path.write_text(content, encoding='utf-8')
          PY

      - name: Add final documentation
        shell: bash
        run: |
          set -euo pipefail
          cat > work/build/przemysl-tour-races/docs/WDROZENIE-PRODUKCYJNE.md <<'MD'
          # Wdrożenie produkcyjne – Przemyśl Tour 1.5.0

          ## Przed aktualizacją
          1. Wykonaj pełną kopię bazy danych i katalogu `wp-content`.
          2. Sprawdź wersję 1.5.0 na kopii stagingowej.
          3. Zachowaj paczkę 1.4.0 oraz kopię bazy jako punkt powrotu.
          4. Sprawdź wymagania: WordPress 6.0+, PHP 7.4+, SimpleXML, HTTPS i zapisywalny katalog uploads.

          ## Aktualizacja
          1. W panelu WordPress wybierz **Wtyczki → Dodaj wtyczkę → Wyślij wtyczkę**.
          2. Wgraj `przemysl-tour-races-1.5.0.zip`.
          3. Wybierz **Zastąp obecną przesłaną wersją**.
          4. Nie usuwaj istniejącej wtyczki i nie kasuj jej tabel.
          5. Otwórz **Przemyśl Tour → Wydanie produkcyjne** i uruchom pełny audyt.

          ## Test dymny po wdrożeniu
          - otwórz stronę wyścigu, trasę, mapę i profil wysokościowy;
          - wykonaj testowe zgłoszenie i sprawdź wiadomość e-mail;
          - sprawdź listę startową i panel uczestników;
          - zaimportuj próbny plik wyników na wydarzeniu testowym;
          - sprawdź wyniki, klasyfikację drużynową i certyfikat;
          - sprawdź REST API, sitemapę oraz `llms.txt`;
          - sprawdź stronę na telefonie i obsługę klawiaturą;
          - sprawdź WP-Cron oraz kolejkę IndexNow, jeżeli jest aktywna.

          ## Powrót do 1.4.0
          1. Włącz tryb serwisowy na poziomie hostingu lub strony.
          2. Przywróć pliki wtyczki 1.4.0 i kopię bazy wykonaną przed aktualizacją.
          3. Nie próbuj ręcznie usuwać tabel ani kolumn.
          4. Wyczyść cache aplikacyjny, obiektowy i CDN.
