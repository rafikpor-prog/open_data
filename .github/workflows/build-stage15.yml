          # Podręcznik administratora – Przemyśl Tour 1.5.0

          ## Najważniejsze moduły
          - **Wyścigi** – wydarzenia, edycje, terminy, harmonogram, partnerzy i FAQ.
          - **Trasy** – GPX, mapy, profile, segmenty, punkty i pliki do pobrania.
          - **Uczestnicy** – zapisy, limity, lista rezerwowa, płatności i eksporty.
