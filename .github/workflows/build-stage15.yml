          - **SEO i AI** – dane strukturalne, mapy XML, Open Graph, LLMS i IndexNow.
          - **Ustawienia** – Google Maps, WCAG, mobile, cache i wydajność.
          - **Wydanie produkcyjne** – końcowy audyt i lista wdrożeniowa.

          ## Zasady bezpieczeństwa
          - dostęp do uczestników i wyników powierzaj wyłącznie upoważnionym kontom;
          - nie przesyłaj eksportów uczestników zwykłą pocztą bez zabezpieczenia;
          - regularnie sprawdzaj retencję i narzędzia prywatności WordPressa;
          - klucz Google Maps ogranicz do domeny i wyłącznie potrzebnych API;
          - nie włączaj `WP_DEBUG_DISPLAY` na stronie produkcyjnej;
          - aktualizacje wykonuj najpierw na stagingu.

          ## Codzienna obsługa wydarzenia
          1. Sprawdź aktywne komunikaty i termin zapisów.
          2. Sprawdź liczbę wolnych miejsc, listę rezerwową i płatności.
