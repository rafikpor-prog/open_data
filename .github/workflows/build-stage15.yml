      - name: Static verification
        shell: bash
        run: |
          set -euo pipefail
          ROOT=work/build/przemysl-tour-races
          test -f "$ROOT/przemysl-tour-races.php"
          grep -q 'Version: 1.5.0' "$ROOT/przemysl-tour-races.php"
          grep -Eq "PTR_VERSION['\"]?[[:space:]]*,[[:space:]]*['\"]1\.5\.0" "$ROOT/przemysl-tour-races.php"
          grep -Eq "PTR_DB_VERSION['\"]?[[:space:]]*,[[:space:]]*['\"]2\.3\.0" "$ROOT/przemysl-tour-races.php"
          test "$(grep -RIl 'Plugin Name:' "$ROOT" --include='*.php' | wc -l)" -eq 1
          test "$(grep -c 'class-ptr-production-readiness.php' "$ROOT/przemysl-tour-races.php")" -eq 1

          PHP_COUNT=0
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
            PHP_COUNT=$((PHP_COUNT+1))
          done < <(find "$ROOT" -type f -name '*.php' -print0)
          echo "PHP files checked: $PHP_COUNT"

          JS_COUNT=0
          while IFS= read -r -d '' file; do
            node --check "$file" >/dev/null
            JS_COUNT=$((JS_COUNT+1))
          done < <(find "$ROOT" -type f -name '*.js' -print0)
          echo "JS files checked: $JS_COUNT"

          python3 - <<'PY'
          from pathlib import Path
          import json
          count=0
          for p in Path('work/build/przemysl-tour-races').rglob('*.json'):
              json.loads(p.read_text(encoding='utf-8'))
              count += 1
          print('JSON files checked:', count)
          PY

          BEFORE="$(wc -l < work/files-before.txt)"
          AFTER="$(find "$ROOT" -type f | wc -l)"
          test "$AFTER" -ge "$BEFORE"
          echo "Files before: $BEFORE; after: $AFTER"

