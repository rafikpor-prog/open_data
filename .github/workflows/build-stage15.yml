name: Build Przemysl Tour Stage 15

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-stage15.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none
          coverage: none

      - name: Download exact 1.4.0 package
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            'https://at.adobe.com/9iPpyw0QofJmgqqz' \
            -o /tmp/przemysl-tour-races-1.4.0.zip
          unzip -t /tmp/przemysl-tour-races-1.4.0.zip

      - name: Prepare complete source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work dist
          mkdir -p work/base dist
          unzip -q /tmp/przemysl-tour-races-1.4.0.zip -d work/base
          MAIN_FILE="$(find work/base -type f -name 'przemysl-tour-races.php' | head -n 1)"
          test -n "$MAIN_FILE"
          SOURCE_ROOT="$(dirname "$MAIN_FILE")"
          mkdir -p work/build/przemysl-tour-races
          cp -a "$SOURCE_ROOT"/. work/build/przemysl-tour-races/
          test -f work/build/przemysl-tour-races/przemysl-tour-races.php
          find work/build/przemysl-tour-races -type f | sort > work/files-before.txt

      - name: Add Stage 15 production readiness module
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/build/przemysl-tour-races/includes
          mkdir -p work/build/przemysl-tour-races/assets/css
          mkdir -p work/build/przemysl-tour-races/assets/js
          mkdir -p work/build/przemysl-tour-races/docs

          cat > work/build/przemysl-tour-races/includes/class-ptr-production-readiness.php <<'PHP'
          <?php
          /**
           * Etap 15: gotowosc produkcyjna, audyt i dokumentacja operacyjna.
           *
           * @package PrzemyslTourRaces
           */

          if ( ! defined( 'ABSPATH' ) ) {
              exit;
          }

          final class PTR_Production_Readiness {
              const VERSION         = '1.5.0';
              const OPTION          = 'ptr_production_readiness';
              const SNAPSHOT_OPTION = 'ptr_production_readiness_snapshot';
              const NONCE_ACTION    = 'ptr_production_readiness_action';

              private static $instance = null;

              public static function instance() {
                  if ( null === self::$instance ) {
                      self::$instance = new self();
                  }
                  return self::$instance;
              }

              private function __construct() {
                  add_action( 'admin_menu', array( $this, 'register_menu' ), 999 );
                  add_action( 'admin_init', array( $this, 'register_settings' ) );
                  add_action( 'admin_enqueue_scripts', array( $this, 'enqueue_admin_assets' ) );
                  add_action( 'wp_ajax_ptr_stage15_run_audit', array( $this, 'ajax_run_audit' ) );
                  add_action( 'wp_ajax_ptr_stage15_clear_cache', array( $this, 'ajax_clear_cache' ) );
                  add_action( 'admin_post_ptr_stage15_export', array( $this, 'export_diagnostics' ) );
                  add_action( 'wp_dashboard_setup', array( $this, 'register_dashboard_widget' ) );
                  add_filter( 'site_status_tests', array( $this, 'register_site_health_test' ) );
                  add_action( 'rest_api_init', array( $this, 'register_rest_route' ) );
              }

              public static function defaults() {
                  return array(
                      'production_approved' => 0,
                      'approved_by'         => 0,
                      'approved_at'         => '',
                      'checklist'           => array(),
                      'notes'               => '',
                  );
              }

              public function settings() {
                  return wp_parse_args( (array) get_option( self::OPTION, array() ), self::defaults() );
              }

              public function register_settings() {
                  register_setting(
                      'ptr_stage15_group',
                      self::OPTION,
                      array(
                          'type'              => 'array',
                          'sanitize_callback' => array( $this, 'sanitize_settings' ),
                          'default'           => self::defaults(),
                      )
                  );
              }

              public function sanitize_settings( $input ) {
                  $old = $this->settings();
                  $out = self::defaults();
                  $allowed = array_keys( $this->deployment_checklist() );
                  $incoming = isset( $input['checklist'] ) && is_array( $input['checklist'] ) ? $input['checklist'] : array();
                  foreach ( $allowed as $key ) {
                      $out['checklist'][ $key ] = empty( $incoming[ $key ] ) ? 0 : 1;
                  }
                  $out['production_approved'] = empty( $input['production_approved'] ) ? 0 : 1;
                  $out['notes'] = isset( $input['notes'] ) ? sanitize_textarea_field( $input['notes'] ) : '';
                  if ( $out['production_approved'] && empty( $old['production_approved'] ) ) {
                      $out['approved_by'] = get_current_user_id();
                      $out['approved_at'] = current_time( 'mysql' );
                  } elseif ( $out['production_approved'] ) {
                      $out['approved_by'] = isset( $old['approved_by'] ) ? absint( $old['approved_by'] ) : get_current_user_id();
                      $out['approved_at'] = isset( $old['approved_at'] ) ? sanitize_text_field( $old['approved_at'] ) : current_time( 'mysql' );
                  }
                  delete_option( self::SNAPSHOT_OPTION );
                  return $out;
              }

              private function find_parent_slug() {
                  global $menu;
                  foreach ( (array) $menu as $entry ) {
                      $label = isset( $entry[0] ) ? wp_strip_all_tags( $entry[0] ) : '';
                      $slug  = isset( $entry[2] ) ? (string) $entry[2] : '';
                      if ( false !== stripos( $label, 'Przemyśl Tour' ) || false !== stripos( $label, 'Przemysl Tour' ) ) {
                          return $slug;
                      }
                  }
                  return '';
              }

              public function register_menu() {
                  $parent = $this->find_parent_slug();
                  if ( $parent ) {
                      add_submenu_page(
                          $parent,
                          'Wydanie produkcyjne',
                          'Wydanie produkcyjne',
                          'manage_options',
                          'ptr-production-readiness',
                          array( $this, 'render_page' )
                      );
                  } else {
                      add_management_page(
                          'Przemyśl Tour – wydanie produkcyjne',
                          'Przemyśl Tour – produkcja',
                          'manage_options',
                          'ptr-production-readiness',
                          array( $this, 'render_page' )
                      );
                  }
              }

              public function enqueue_admin_assets( $hook ) {
                  if ( false === strpos( (string) $hook, 'ptr-production-readiness' ) ) {
                      return;
                  }
                  $base_url = defined( 'PTR_PLUGIN_URL' ) ? PTR_PLUGIN_URL : plugin_dir_url( dirname( __DIR__ ) . '/przemysl-tour-races.php' );
                  wp_enqueue_style( 'ptr-stage15-admin', $base_url . 'assets/css/production-readiness.css', array(), self::VERSION );
                  wp_enqueue_script( 'ptr-stage15-admin', $base_url . 'assets/js/production-readiness.js', array( 'jquery' ), self::VERSION, true );
                  wp_localize_script(
                      'ptr-stage15-admin',
                      'PTRStage15',
                      array(
                          'ajaxUrl' => admin_url( 'admin-ajax.php' ),
                          'nonce'   => wp_create_nonce( self::NONCE_ACTION ),
                          'running' => 'Trwa wykonywanie audytu…',
                          'error'   => 'Nie udało się wykonać operacji.',
                      )
                  );
              }

              private function memory_to_bytes( $value ) {
                  $value = trim( (string) $value );
                  if ( '' === $value || '-1' === $value ) {
                      return PHP_INT_MAX;
                  }
                  $unit = strtolower( substr( $value, -1 ) );
                  $number = (float) $value;
                  if ( 'g' === $unit ) {
                      $number *= 1024;
                  }
                  if ( in_array( $unit, array( 'g', 'm' ), true ) ) {
                      $number *= 1024;
                  }
                  if ( in_array( $unit, array( 'g', 'm', 'k' ), true ) ) {
                      $number *= 1024;
                  }
                  return (int) $number;
              }

              private function table_exists( $table ) {
                  global $wpdb;
                  return $table === $wpdb->get_var( $wpdb->prepare( 'SHOW TABLES LIKE %s', $wpdb->esc_like( $table ) ) );
              }

              private function maps_key_exists() {
                  $settings = get_option( 'ptr_settings', array() );
                  if ( ! is_array( $settings ) ) {
                      return false;
                  }
                  foreach ( array( 'google_maps_api_key', 'maps_api_key', 'google_api_key' ) as $key ) {
                      if ( ! empty( $settings[ $key ] ) ) {
                          return true;
                      }
                  }
                  return false;
              }

              private function required_files() {
                  $root = dirname( __DIR__ );
                  return array(
                      $root . '/przemysl-tour-races.php',
                      $root . '/includes/class-ptr-production-readiness.php',
                      $root . '/assets/css/production-readiness.css',
                      $root . '/assets/js/production-readiness.js',
                      $root . '/docs/WDROZENIE-PRODUKCYJNE.md',
                      $root . '/docs/ADMINISTRATOR.md',
                  );
              }

              private function add_check( &$checks, $id, $label, $status, $message, $critical, $group ) {
                  $checks[ $id ] = array(
                      'id'       => $id,
                      'label'    => $label,
                      'status'   => $status,
                      'message'  => $message,
                      'critical' => (bool) $critical,
                      'group'    => $group,
                  );
              }

              public function run_checks( $force = false ) {
                  if ( ! $force ) {
                      $snapshot = get_option( self::SNAPSHOT_OPTION, array() );
                      if ( is_array( $snapshot ) && ! empty( $snapshot['generated_gmt'] ) && strtotime( $snapshot['generated_gmt'] ) > time() - 15 * MINUTE_IN_SECONDS ) {
                          return $snapshot;
                      }
                  }

                  global $wpdb;
                  $checks = array();
                  $wp_version = get_bloginfo( 'version' );
                  $php_ok = version_compare( PHP_VERSION, '7.4', '>=' );
                  $wp_ok = version_compare( $wp_version, '6.0', '>=' );
                  $this->add_check( $checks, 'php', 'Wersja PHP', $php_ok ? 'good' : 'critical', 'PHP ' . PHP_VERSION . '; wymagane co najmniej 7.4.', true, 'Środowisko' );
                  $this->add_check( $checks, 'wordpress', 'Wersja WordPress', $wp_ok ? 'good' : 'critical', 'WordPress ' . $wp_version . '; wymagane co najmniej 6.0.', true, 'Środowisko' );

                  $plugin_version = defined( 'PTR_VERSION' ) ? PTR_VERSION : 'nieustalona';
                  $version_ok = defined( 'PTR_VERSION' ) && version_compare( PTR_VERSION, '1.5.0', '>=' );
                  $this->add_check( $checks, 'plugin_version', 'Wersja wtyczki', $version_ok ? 'good' : 'critical', 'Wykryta wersja: ' . $plugin_version . '.', true, 'Wydanie' );

                  $db_version = defined( 'PTR_DB_VERSION' ) ? PTR_DB_VERSION : get_option( 'ptr_db_version', 'nieustalona' );
                  $db_ok = 'nieustalona' !== $db_version && version_compare( (string) $db_version, '2.3.0', '>=' );
                  $this->add_check( $checks, 'db_version', 'Wersja modelu danych', $db_ok ? 'good' : 'warning', 'Wykryta wersja danych: ' . $db_version . '.', false, 'Wydanie' );

                  $https = is_ssl() || 0 === strpos( home_url( '/' ), 'https://' );
                  $this->add_check( $checks, 'https', 'HTTPS', $https ? 'good' : 'critical', $https ? 'Serwis korzysta z HTTPS.' : 'Adres serwisu nie korzysta z HTTPS.', true, 'Bezpieczeństwo' );

                  $debug = defined( 'WP_DEBUG' ) && WP_DEBUG;
                  $this->add_check( $checks, 'debug', 'Tryb debugowania', $debug ? 'warning' : 'good', $debug ? 'WP_DEBUG jest włączony. Na produkcji wyłącz wyświetlanie błędów.' : 'WP_DEBUG jest wyłączony.', false, 'Bezpieczeństwo' );

                  $display_errors = (bool) ini_get( 'display_errors' );
                  $this->add_check( $checks, 'display_errors', 'Wyświetlanie błędów PHP', $display_errors ? 'warning' : 'good', $display_errors ? 'display_errors jest włączone.' : 'Błędy PHP nie są wyświetlane użytkownikom.', false, 'Bezpieczeństwo' );

                  $permalinks = (string) get_option( 'permalink_structure', '' );
                  $this->add_check( $checks, 'permalinks', 'Bezpośrednie odnośniki', $permalinks ? 'good' : 'warning', $permalinks ? 'Struktura adresów jest skonfigurowana.' : 'Używana jest domyślna struktura zapytań.', false, 'WordPress' );

                  $cron_ok = ! ( defined( 'DISABLE_WP_CRON' ) && DISABLE_WP_CRON );
                  $this->add_check( $checks, 'cron', 'WP-Cron', $cron_ok ? 'good' : 'warning', $cron_ok ? 'Wbudowany WP-Cron nie jest wyłączony.' : 'WP-Cron jest wyłączony; wymagany jest cron systemowy.', false, 'WordPress' );

                  $rest_ok = function_exists( 'rest_get_server' );
                  $this->add_check( $checks, 'rest', 'REST API', $rest_ok ? 'good' : 'critical', $rest_ok ? 'REST API jest dostępne.' : 'Nie wykryto serwera REST API.', true, 'WordPress' );

                  $upload = wp_upload_dir();
                  $upload_ok = empty( $upload['error'] ) && ! empty( $upload['basedir'] ) && is_dir( $upload['basedir'] ) && wp_is_writable( $upload['basedir'] );
                  $this->add_check( $checks, 'uploads', 'Katalog uploads', $upload_ok ? 'good' : 'critical', $upload_ok ? 'Katalog mediów jest zapisywalny.' : 'Katalog mediów nie jest zapisywalny.', true, 'Środowisko' );

                  $memory = ini_get( 'memory_limit' );
                  $memory_bytes = $this->memory_to_bytes( $memory );
                  $memory_status = $memory_bytes >= 256 * MB_IN_BYTES ? 'good' : ( $memory_bytes >= 128 * MB_IN_BYTES ? 'warning' : 'critical' );
                  $this->add_check( $checks, 'memory', 'Limit pamięci PHP', $memory_status, 'Ustawiony limit: ' . $memory . '; zalecane minimum 256M.', 'critical' === $memory_status, 'Środowisko' );

                  $simplexml = extension_loaded( 'simplexml' );
                  $this->add_check( $checks, 'simplexml', 'Rozszerzenie SimpleXML', $simplexml ? 'good' : 'critical', $simplexml ? 'SimpleXML jest dostępne.' : 'Brak SimpleXML; import GPX/XLSX może nie działać.', true, 'Środowisko' );

                  $reg_table = $wpdb->prefix . 'ptr_registrations';
                  $results_table = $wpdb->prefix . 'ptr_results';
                  $this->add_check( $checks, 'registrations_table', 'Tabela uczestników', $this->table_exists( $reg_table ) ? 'good' : 'critical', $this->table_exists( $reg_table ) ? 'Tabela uczestników istnieje.' : 'Brak tabeli uczestników.', true, 'Dane' );
                  $this->add_check( $checks, 'results_table', 'Tabela wyników', $this->table_exists( $results_table ) ? 'good' : 'critical', $this->table_exists( $results_table ) ? 'Tabela wyników istnieje.' : 'Brak tabeli wyników.', true, 'Dane' );

                  $maps = $this->maps_key_exists();
                  $this->add_check( $checks, 'maps', 'Google Maps API', $maps ? 'good' : 'warning', $maps ? 'Klucz Google Maps został zapisany.' : 'Nie wykryto klucza Google Maps API.', false, 'Integracje' );

                  $files_ok = true;
                  $missing_files = array();
                  foreach ( $this->required_files() as $file ) {
                      if ( ! is_readable( $file ) ) {
                          $files_ok = false;
                          $missing_files[] = basename( $file );
                      }
                  }
                  $this->add_check( $checks, 'files', 'Integralność plików wydania', $files_ok ? 'good' : 'critical', $files_ok ? 'Wymagane pliki wydania są dostępne.' : 'Brakuje: ' . implode( ', ', $missing_files ) . '.', true, 'Wydanie' );

                  $settings = $this->settings();
                  $checklist = $this->deployment_checklist();
                  $completed = 0;
                  foreach ( $checklist as $key => $label ) {
                      if ( ! empty( $settings['checklist'][ $key ] ) ) {
                          $completed++;
                      }
                  }
                  $checklist_status = $completed === count( $checklist ) ? 'good' : 'warning';
                  $this->add_check( $checks, 'deployment_checklist', 'Lista wdrożeniowa', $checklist_status, sprintf( 'Potwierdzono %d z %d czynności.', $completed, count( $checklist ) ), false, 'Wdrożenie' );

                  $critical = 0;
                  $warning = 0;
                  $good = 0;
                  foreach ( $checks as $check ) {
                      if ( 'critical' === $check['status'] ) {
                          $critical++;
                      } elseif ( 'warning' === $check['status'] ) {
                          $warning++;
                      } else {
                          $good++;
                      }
                  }
                  $total = max( 1, count( $checks ) );
                  $score = (int) round( 100 * ( $good + 0.5 * $warning ) / $total );
                  $overall = $critical > 0 ? 'critical' : ( $warning > 0 ? 'warning' : 'good' );
                  $snapshot = array(
                      'generated'     => current_time( 'mysql' ),
                      'generated_gmt' => gmdate( 'Y-m-d H:i:s' ),
                      'score'         => $score,
                      'overall'       => $overall,
                      'summary'       => array( 'good' => $good, 'warning' => $warning, 'critical' => $critical ),
                      'checks'        => $checks,
                  );
                  update_option( self::SNAPSHOT_OPTION, $snapshot, false );
                  return $snapshot;
              }

              public function deployment_checklist() {
                  return array(
                      'backup'        => 'Wykonano pełną kopię plików i bazy danych.',
                      'staging'       => 'Aktualizację sprawdzono na kopii stagingowej.',
                      'forms'         => 'Przetestowano zapisy, wiadomości e-mail i link zarządzania zgłoszeniem.',
                      'payments'      => 'Sprawdzono konfigurację płatności lub tryb bez opłat.',
                      'maps'          => 'Zweryfikowano mapy, profil wysokościowy i ograniczenia klucza Google.',
                      'results'       => 'Wykonano próbny import wyników i sprawdzono klasyfikacje.',
                      'privacy'       => 'Zatwierdzono regulamin, zgody, politykę prywatności i retencję danych.',
                      'accessibility' => 'Sprawdzono klawiaturę, fokus, kontrast i widok mobilny.',
                      'seo'           => 'Sprawdzono canonical, Schema.org, mapy XML oraz indeksowanie.',
                      'cron'          => 'Potwierdzono działanie WP-Cron lub crona systemowego.',
                      'monitoring'    => 'Ustalono procedurę monitorowania błędów i kopii zapasowych.',
                      'rollback'      => 'Przygotowano plan powrotu do wersji 1.4.0.',
                  );
              }

              private function status_label( $status ) {
                  $labels = array( 'good' => 'Poprawnie', 'warning' => 'Zalecenie', 'critical' => 'Błąd krytyczny' );
                  return isset( $labels[ $status ] ) ? $labels[ $status ] : $status;
              }

              public function render_page() {
                  if ( ! current_user_can( 'manage_options' ) ) {
                      wp_die( esc_html__( 'Brak uprawnień.', 'przemysl-tour-races' ) );
                  }
                  $snapshot = $this->run_checks();
                  $settings = $this->settings();
                  ?>
                  <div class="wrap ptr-stage15-wrap">
                      <div class="ptr-stage15-header">
                          <div>
                              <h1>Przemyśl Tour – wydanie produkcyjne 1.5.0</h1>
                              <p>Końcowy audyt bezpieczeństwa, zgodności i gotowości do uruchomienia serwisu produkcyjnego.</p>
                          </div>
                          <div class="ptr-stage15-actions">
                              <button type="button" class="button button-primary ptr-stage15-run-audit">Uruchom pełny audyt</button>
                              <a class="button" href="<?php echo esc_url( wp_nonce_url( admin_url( 'admin-post.php?action=ptr_stage15_export' ), self::NONCE_ACTION ) ); ?>">Pobierz diagnostykę JSON</a>
                          </div>
                      </div>

                      <div class="ptr-stage15-score ptr-stage15-status-<?php echo esc_attr( $snapshot['overall'] ); ?>">
                          <div class="ptr-stage15-score-number"><strong><?php echo esc_html( $snapshot['score'] ); ?>%</strong><span>gotowości</span></div>
                          <div><h2><?php echo esc_html( $this->status_label( $snapshot['overall'] ) ); ?></h2><p>Poprawnie: <?php echo esc_html( $snapshot['summary']['good'] ); ?> · Zalecenia: <?php echo esc_html( $snapshot['summary']['warning'] ); ?> · Krytyczne: <?php echo esc_html( $snapshot['summary']['critical'] ); ?></p><p>Ostatni audyt: <?php echo esc_html( $snapshot['generated'] ); ?></p></div>
                      </div>

                      <div class="ptr-stage15-live screen-reader-text" aria-live="polite"></div>

                      <?php
                      $groups = array();
                      foreach ( $snapshot['checks'] as $check ) {
                          if ( ! isset( $groups[ $check['group'] ] ) ) {
                              $groups[ $check['group'] ] = array();
                          }
                          $groups[ $check['group'] ][] = $check;
                      }
                      foreach ( $groups as $group => $checks ) :
                          ?>
                          <section class="ptr-stage15-panel">
                              <h2><?php echo esc_html( $group ); ?></h2>
                              <div class="ptr-stage15-checks">
                                  <?php foreach ( $checks as $check ) : ?>
                                      <article class="ptr-stage15-check ptr-stage15-status-<?php echo esc_attr( $check['status'] ); ?>">
                                          <span class="dashicons <?php echo 'good' === $check['status'] ? 'dashicons-yes-alt' : 'dashicons-warning'; ?>" aria-hidden="true"></span>
                                          <div><h3><?php echo esc_html( $check['label'] ); ?></h3><p><?php echo esc_html( $check['message'] ); ?></p><span><?php echo esc_html( $this->status_label( $check['status'] ) ); ?></span></div>
                                      </article>
                                  <?php endforeach; ?>
                              </div>
                          </section>
                      <?php endforeach; ?>

                      <form method="post" action="options.php" class="ptr-stage15-panel">
                          <?php settings_fields( 'ptr_stage15_group' ); ?>
                          <h2>Lista wdrożeniowa</h2>
                          <p>Potwierdź czynności wykonane na kopii serwisu i w środowisku produkcyjnym.</p>
                          <div class="ptr-stage15-deployment-list">
                              <?php foreach ( $this->deployment_checklist() as $key => $label ) : ?>
                                  <label><input type="checkbox" name="<?php echo esc_attr( self::OPTION ); ?>[checklist][<?php echo esc_attr( $key ); ?>]" value="1" <?php checked( ! empty( $settings['checklist'][ $key ] ) ); ?>> <span><?php echo esc_html( $label ); ?></span></label>
                              <?php endforeach; ?>
                          </div>
                          <p><label for="ptr-stage15-notes"><strong>Notatki wdrożeniowe</strong></label><br><textarea id="ptr-stage15-notes" name="<?php echo esc_attr( self::OPTION ); ?>[notes]" rows="5" class="large-text"><?php echo esc_textarea( $settings['notes'] ); ?></textarea></p>
                          <label class="ptr-stage15-approval"><input type="checkbox" name="<?php echo esc_attr( self::OPTION ); ?>[production_approved]" value="1" <?php checked( ! empty( $settings['production_approved'] ) ); ?>> <span>Potwierdzam świadome zatwierdzenie konfiguracji do pracy produkcyjnej.</span></label>
                          <?php if ( ! empty( $settings['approved_at'] ) ) : ?><p class="description">Ostatnie zatwierdzenie: <?php echo esc_html( $settings['approved_at'] ); ?>.</p><?php endif; ?>
                          <?php submit_button( 'Zapisz listę wdrożeniową' ); ?>
                      </form>

                      <section class="ptr-stage15-panel">
                          <h2>Narzędzia końcowe</h2>
                          <p><button type="button" class="button ptr-stage15-clear-cache">Wyczyść cache Przemyśl Tour</button> <a class="button" href="<?php echo esc_url( admin_url( 'site-health.php' ) ); ?>">Otwórz Stan witryny</a></p>
                          <p class="ptr-stage15-tool-result" aria-live="polite"></p>
                          <p>Dokumentacja znajduje się w katalogu <code>docs/</code> paczki wtyczki: <code>ADMINISTRATOR.md</code>, <code>WDROZENIE-PRODUKCYJNE.md</code> i <code>TESTY-ETAP-15.md</code>.</p>
                      </section>
                  </div>
                  <?php
              }

              public function ajax_run_audit() {
                  check_ajax_referer( self::NONCE_ACTION, 'nonce' );
                  if ( ! current_user_can( 'manage_options' ) ) {
                      wp_send_json_error( array( 'message' => 'Brak uprawnień.' ), 403 );
                  }
                  $snapshot = $this->run_checks( true );
                  wp_send_json_success( array( 'message' => 'Audyt zakończony.', 'snapshot' => $snapshot ) );
              }

              public function ajax_clear_cache() {
                  check_ajax_referer( self::NONCE_ACTION, 'nonce' );
                  if ( ! current_user_can( 'manage_options' ) ) {
                      wp_send_json_error( array( 'message' => 'Brak uprawnień.' ), 403 );
                  }
                  global $wpdb;
                  $like_a = $wpdb->esc_like( '_transient_ptr_' ) . '%';
                  $like_b = $wpdb->esc_like( '_transient_timeout_ptr_' ) . '%';
                  $deleted = (int) $wpdb->query( $wpdb->prepare( "DELETE FROM {$wpdb->options} WHERE option_name LIKE %s OR option_name LIKE %s", $like_a, $like_b ) );
                  delete_option( self::SNAPSHOT_OPTION );
                  wp_send_json_success( array( 'message' => sprintf( 'Usunięto %d wpisów cache.', max( 0, $deleted ) ) ) );
              }

              public function export_diagnostics() {
                  if ( ! current_user_can( 'manage_options' ) ) {
                      wp_die( 'Brak uprawnień.' );
                  }
                  check_admin_referer( self::NONCE_ACTION );
                  $snapshot = $this->run_checks( true );
                  $payload = array(
                      'generatedAt' => gmdate( 'c' ),
                      'site' => array(
                          'url'       => home_url( '/' ),
                          'locale'    => get_locale(),
                          'multisite' => is_multisite(),
                      ),
                      'versions' => array(
                          'plugin'    => defined( 'PTR_VERSION' ) ? PTR_VERSION : null,
                          'database'  => defined( 'PTR_DB_VERSION' ) ? PTR_DB_VERSION : get_option( 'ptr_db_version' ),
                          'wordpress' => get_bloginfo( 'version' ),
                          'php'       => PHP_VERSION,
                      ),
                      'readiness' => $snapshot,
                  );
                  nocache_headers();
                  header( 'Content-Type: application/json; charset=utf-8' );
                  header( 'Content-Disposition: attachment; filename=przemysl-tour-diagnostyka-' . gmdate( 'Y-m-d-His' ) . '.json' );
                  echo wp_json_encode( $payload, JSON_PRETTY_PRINT | JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES );
                  exit;
              }

              public function register_dashboard_widget() {
                  if ( current_user_can( 'manage_options' ) ) {
                      wp_add_dashboard_widget( 'ptr_production_readiness_widget', 'Przemyśl Tour – gotowość produkcyjna', array( $this, 'render_dashboard_widget' ) );
                  }
              }

              public function render_dashboard_widget() {
                  $snapshot = $this->run_checks();
                  echo '<p><strong>' . esc_html( $snapshot['score'] ) . '% gotowości</strong></p>';
                  echo '<p>Poprawnie: ' . esc_html( $snapshot['summary']['good'] ) . ' · Zalecenia: ' . esc_html( $snapshot['summary']['warning'] ) . ' · Krytyczne: ' . esc_html( $snapshot['summary']['critical'] ) . '</p>';
                  echo '<p><a class="button" href="' . esc_url( admin_url( 'admin.php?page=ptr-production-readiness' ) ) . '">Otwórz audyt</a></p>';
              }

              public function register_site_health_test( $tests ) {
                  $tests['direct']['ptr_production_readiness'] = array(
                      'label' => 'Przemyśl Tour: gotowość produkcyjna',
                      'test'  => array( $this, 'site_health_test' ),
                  );
                  return $tests;
              }

              public function site_health_test() {
                  $snapshot = $this->run_checks();
                  $good = 0 === (int) $snapshot['summary']['critical'];
                  return array(
                      'label'       => $good ? 'Przemyśl Tour nie wykrywa błędów krytycznych' : 'Przemyśl Tour wykrywa błędy krytyczne',
                      'status'      => $good ? 'good' : 'critical',
                      'badge'       => array( 'label' => 'Przemyśl Tour', 'color' => 'blue' ),
                      'description' => '<p>Wynik gotowości: ' . esc_html( $snapshot['score'] ) . '%. Krytyczne: ' . esc_html( $snapshot['summary']['critical'] ) . ', zalecenia: ' . esc_html( $snapshot['summary']['warning'] ) . '.</p>',
                      'actions'     => '<p><a href="' . esc_url( admin_url( 'admin.php?page=ptr-production-readiness' ) ) . '">Otwórz pełny audyt</a></p>',
                      'test'        => 'ptr_production_readiness',
                  );
              }

              public function register_rest_route() {
                  register_rest_route(
                      'ptr/v1',
                      '/admin/production-readiness',
                      array(
                          'methods'             => WP_REST_Server::READABLE,
                          'callback'            => array( $this, 'rest_readiness' ),
                          'permission_callback' => function () {
                              return current_user_can( 'manage_options' );
                          },
                      )
                  );
              }

              public function rest_readiness() {
                  return rest_ensure_response( $this->run_checks() );
              }
          }

          PTR_Production_Readiness::instance();
