name: Verify installable Przemysl Tour 1.5.0

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-stage15-installable.yml'

permissions:
  actions: read
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Download final installable artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            'https://api.github.com/repos/rafikpor-prog/open_data/actions/artifacts/8527089646/zip' \
            -o /tmp/final.zip
          unzip -t /tmp/final.zip

      - name: Verify WordPress upgrade layout and code
        run: |
          set -euo pipefail
          ROOTS="$(zipinfo -1 /tmp/final.zip | awk -F/ 'NF{print $1}' | sort -u)"
          test "$ROOTS" = 'przemysl-tour-races'
          rm -rf /tmp/final
          mkdir -p /tmp/final
          unzip -q /tmp/final.zip -d /tmp/final
          MAIN=/tmp/final/przemysl-tour-races/przemysl-tour-races.php
          test -f "$MAIN"
          grep -q 'Version: 1.5.0' "$MAIN"
          grep -q 'class-ptr-production-readiness.php' "$MAIN"
          test "$(grep -RIl 'Plugin Name:' /tmp/final/przemysl-tour-races --include='*.php' | wc -l)" -eq 1
          while IFS= read -r -d '' file; do php -l "$file" >/dev/null; done < <(find /tmp/final/przemysl-tour-races -type f -name '*.php' -print0)
          while IFS= read -r -d '' file; do node --check "$file" >/dev/null; done < <(find /tmp/final/przemysl-tour-races -type f -name '*.js' -print0)
          echo 'Final WordPress update ZIP is valid.'
