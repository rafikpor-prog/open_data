[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-data-plugin"
version = "0.1.0"
description = "Open Data Plugin ingestion prototype"
requires-python = ">=3.10"
authors = [{name = "Open Data Team"}]
dependencies = [
    "SQLAlchemy>=2.0,<3.0",
    "matplotlib>=3.7,<4.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
